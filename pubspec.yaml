name: powerpilot
description: "PowerPilot: monitor and control your UPS from your phone"
publish_to: 'none'

# The versionName only. The versionCode is the number of v* tags, which
# `make build-aab` passes as --build-number (docs/release.md).
version: 1.0.1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  lucide_icons_flutter: ^4.0.0
  flutter_secure_storage: ^11.2.0
  mobile_scanner: ^7.4.2
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # The design (mobile.pen) reads the same files, so they stay in images/.
  assets:
    - images/logo.png
    - images/ups-front.png
    - images/ups-flow.png

  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter-Regular.ttf
        - asset: fonts/Inter-Medium.ttf
          weight: 500
        - asset: fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: fonts/Inter-Bold.ttf
          weight: 700
